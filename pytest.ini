# Reglages de pytest pour le projet
[pytest]
# "import src..." fonctionne depuis les tests
pythonpath = .
testpaths = tests
# Seuls les fichiers test_*.py sont des tests (pas inventaire_docs_test.py)
python_files = test_*.py
# Ne jamais explorer le dossier des documents d'exemple
norecursedirs = docs_test
# Tests "reels" (vrai Ollama) : exclus par defaut, lances a part avec
#   python -m pytest -m ollama_reel -s
markers =
    ollama_reel: appelle le vrai Ollama (lent, OCR arrete, a lancer a part)
addopts = -m "not ollama_reel"
